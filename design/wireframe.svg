<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .bg{fill:#f7f5f0}
      .card{fill:#fffdf8;stroke:#ddd7cc;stroke-width:1.5;rx:10}
      .ink{fill:#1c1a17}
      .muted{fill:#6b655c}
      .pos{fill:#2f7d54}
      .neg{fill:#b4543a}
      .accent{fill:#2f5d7d}
      .ph{fill:#ece7dd;stroke:#ddd7cc;stroke-width:1}
      .line{stroke:#ddd7cc;stroke-width:1.5}
      .ann{fill:#9a4a2f;font-size:11px;font-style:italic}
      .annline{stroke:#c98a72;stroke-width:1;stroke-dasharray:3 3}
      text{fill:#1c1a17}
      .h1{font-size:24px;font-weight:700}
      .h2{font-size:17px;font-weight:600}
      .h3{font-size:14px;font-weight:600}
      .lbl{font-size:11px;fill:#6b655c;text-transform:uppercase;letter-spacing:.5px}
      .val{font-size:14px;font-weight:600}
      .sm{font-size:11px;fill:#6b655c}
      .big{font-size:22px;font-weight:700}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="1020"/>

  <!-- ============ MASTHEAD ============ -->
  <text class="h1" x="32" y="48">commune.ai</text>
  <text class="sm" x="32" y="68">Pilot your household. Run an institution. Watch the ecosystem move.</text>
  <rect class="ph" x="980" y="30" width="160" height="32" rx="6"/>
  <text class="sm" x="992" y="50">your handle ▸ "Ann"</text>
  <circle cx="1162" cy="46" r="6" fill="#2f7d54"/>
  <text class="sm" x="1150" y="74" text-anchor="end">● live</text>
  <line class="line" x1="32" y1="86" x2="1208" y2="86" stroke="#1c1a17" stroke-width="2"/>

  <!-- ============ FEDERATION SUMMARY BAR ============ -->
  <rect class="card" x="32" y="104" width="1176" height="64" rx="10"/>
  <g transform="translate(52,124)">
    <text class="lbl" x="0" y="0">Federation</text><text class="val pos" x="0" y="22">solvent</text>
    <text class="lbl" x="150" y="0">Reserve</text><text class="val" x="150" y="22">$50,050</text>
    <text class="lbl" x="300" y="0">Clearing charges</text><text class="val" x="300" y="22">$0</text>
    <text class="lbl" x="470" y="0">Members</text><text class="val" x="470" y="22">5</text>
    <text class="lbl" x="560" y="0">Nodes</text><text class="val" x="560" y="22">2</text>
    <text class="lbl" x="700" y="0">Period (sim month)</text><text class="val" x="700" y="22">3</text>
  </g>
  <g transform="translate(880,124)">
    <text class="lbl" x="0" y="0">Federation role · compression + demurrage</text>
    <text class="val" x="0" y="22">held by "Ann"</text>
    <rect class="ph" x="200" y="6" width="64" height="22" rx="6"/><text class="sm" x="210" y="21">release</text>
  </g>
  <text class="ann" x="1050" y="190" text-anchor="end">↑ world-wide status, always visible</text>
  <line class="annline" x1="1052" y1="186" x2="1010" y2="168"/>

  <!-- ============ LEFT PANEL: YOUR HOUSEHOLD ============ -->
  <rect class="card" x="32" y="208" width="360" height="772" rx="10"/>
  <text class="h2" x="52" y="240">Your household <tspan class="sm">(joined)</tspan></text>

  <!-- selects -->
  <text class="lbl" x="52" y="266">You are a…</text>
  <rect class="ph" x="52" y="272" width="320" height="34" rx="6"/><text class="sm" x="64" y="294">Service worker ▾</text>
  <text class="lbl" x="52" y="328">Node</text>
  <rect class="ph" x="52" y="334" width="320" height="34" rx="6"/><text class="sm" x="64" y="356">Node #1 · Norfolk ▾</text>

  <!-- number rows -->
  <g transform="translate(52,386)">
    <text class="sm" x="0" y="14">Your rent / carry now ($/mo)</text><rect class="ph" x="240" y="0" width="80" height="26" rx="5"/><text class="sm" x="280" y="18" text-anchor="middle">1,500</text>
    <text class="sm" x="0" y="48">Hours you'd contribute (hrs/mo)</text><rect class="ph" x="240" y="34" width="80" height="26" rx="5"/><text class="sm" x="280" y="52" text-anchor="middle">20</text>
    <text class="sm" x="0" y="82">Limited-equity buy-in ($)</text><rect class="ph" x="240" y="68" width="80" height="26" rx="5"/><text class="sm" x="280" y="86" text-anchor="middle">0</text>
  </g>

  <!-- before/after net + chart -->
  <line class="line" x1="52" y1="502" x2="372" y2="502" stroke="#1c1a17" stroke-width="2"/>
  <text class="big pos" x="52" y="536">$10,800/yr</text><text class="sm" x="200" y="536">better off</text>
  <!-- mini before/after bars -->
  <g transform="translate(52,556)">
    <rect class="neg" x="40" y="20" width="70" height="70" opacity="0.85"/><text class="sm" x="75" y="106" text-anchor="middle">Now</text>
    <rect class="pos" x="180" y="55" width="70" height="35"/><text class="sm" x="215" y="106" text-anchor="middle">Commune</text>
    <text class="sm" x="300" y="60">annual outlay</text><text class="sm" x="300" y="74">(lower = better)</text>
  </g>
  <!-- lines table -->
  <g transform="translate(52,680)">
    <text class="sm" x="0" y="0">Housing (cash share)</text><text class="sm" x="320" y="0" text-anchor="end">$6,000</text>
    <text class="sm" x="0" y="18">Rent paid in labor credit</text><text class="sm" x="320" y="18" text-anchor="end">−$12,000</text>
    <text class="sm" x="0" y="36">Labor credit earned</text><text class="sm" x="320" y="36" text-anchor="end">−$6,000</text>
  </g>

  <!-- LEDGER block -->
  <line class="line" x1="52" y1="730" x2="372" y2="730" stroke-dasharray="4 3"/>
  <text class="lbl" x="52" y="752">Mutual-credit balance</text>
  <text class="big pos" x="52" y="780">1,000 CC</text>
  <text class="sm" x="52" y="798">eroding $50/yr (demurrage) — ticks live</text>
  <g transform="translate(52,812)">
    <text class="sm" x="0" y="18">Log labor</text><rect class="ph" x="64" y="2" width="60" height="24" rx="5"/><text class="sm" x="94" y="19" text-anchor="middle">8</text>
    <rect class="ph" x="132" y="2" width="90" height="24" rx="5"/><text class="sm" x="177" y="19" text-anchor="middle">mint credit</text>
  </g>
  <g transform="translate(52,848)">
    <text class="sm" x="0" y="18">Send CC</text><rect class="ph" x="64" y="2" width="150" height="24" rx="5"/><text class="sm" x="72" y="19">to Bob (250) ▾</text>
    <rect class="ph" x="222" y="2" width="60" height="24" rx="5"/><text class="sm" x="252" y="19" text-anchor="middle">500</text>
    <rect class="ph" x="290" y="2" width="56" height="24" rx="5"/><text class="sm" x="318" y="19" text-anchor="middle">send</text>
  </g>
  <text class="ann" x="400" y="800">← ledger: balance is a live</text>
  <text class="ann" x="400" y="814">fold over the tx stream</text>
  <line class="annline" x1="398" y1="796" x2="372" y2="780"/>

  <!-- ============ RIGHT: THE FEDERATION ============ -->
  <text class="h2" x="416" y="240">The federation</text>
  <rect class="ph" x="1010" y="222" width="130" height="28" rx="6"/><text class="sm" x="1022" y="240">found a node… +</text>

  <!-- NODE CARD 1 -->
  <g transform="translate(416,264)">
    <rect class="card" x="0" y="0" width="384" height="300" rx="10"/>
    <rect x="0" y="0" width="5" height="300" fill="#2f7d54"/>
    <text class="h3" x="20" y="28">Node #1 · Norfolk</text>
    <rect x="300" y="12" width="68" height="20" rx="10" fill="#d8ecdf"/><text class="sm" x="334" y="26" text-anchor="middle" fill="#2f7d54">clears</text>
    <!-- stats grid -->
    <g transform="translate(20,52)" font-size="12">
      <text class="sm" x="0" y="0">Members</text><text x="170" y="0" text-anchor="end">3</text>
      <text class="sm" x="190" y="0">Committed bonds</text><text x="350" y="0" text-anchor="end">$700,000</text>
      <text class="sm" x="0" y="20">Committed equity</text><text x="170" y="20" text-anchor="end">$200,000</text>
      <text class="sm" x="190" y="20">Mortgage</text><text x="350" y="20" text-anchor="end">$1.40M</text>
      <text class="sm" x="0" y="40">Node net</text><text class="pos" x="170" y="40" text-anchor="end">$16,013</text>
      <text class="sm" x="190" y="40">Pool balance</text><text x="350" y="40" text-anchor="end">−1,000 CC</text>
    </g>
    <line class="line" x1="20" y1="116" x2="364" y2="116"/>
    <text class="sm" x="20" y="138">Capital stack: <tspan font-weight="700" fill="#1c1a17">Ann</tspan></text>
    <rect class="ph" x="300" y="124" width="64" height="20" rx="6"/><text class="sm" x="332" y="138" text-anchor="middle">release</text>
    <!-- governance sliders (unlocked) -->
    <g transform="translate(20,158)">
      <text class="sm" x="0" y="0">Internal rent / mo</text><text x="344" y="0" text-anchor="end" font-weight="600">$1,200</text>
      <rect class="ph" x="0" y="8" width="344" height="6" rx="3"/><circle cx="120" cy="11" r="7" fill="#2f5d7d"/>
      <text class="sm" x="0" y="36">Commercial rent / mo</text><text x="344" y="36" text-anchor="end" font-weight="600">$3,000</text>
      <rect class="ph" x="0" y="44" width="344" height="6" rx="3"/><circle cx="90" cy="47" r="7" fill="#2f5d7d"/>
      <text class="sm" x="0" y="72">Bond rate</text><text x="344" y="72" text-anchor="end" font-weight="600">5.00%</text>
      <rect class="ph" x="0" y="80" width="344" height="6" rx="3"/><circle cx="150" cy="83" r="7" fill="#2f5d7d"/>
      <text class="sm" x="0" y="108">Mortgage rate</text><text x="344" y="108" text-anchor="end" font-weight="600">6.50%</text>
      <rect class="ph" x="0" y="116" width="344" height="6" rx="3"/><circle cx="180" cy="119" r="7" fill="#2f5d7d"/>
    </g>
  </g>

  <!-- NODE CARD 2 (locked governance) -->
  <g transform="translate(820,264)">
    <rect class="card" x="0" y="0" width="384" height="300" rx="10"/>
    <rect x="0" y="0" width="5" height="300" fill="#b4543a"/>
    <text class="h3" x="20" y="28">Node #2 · Richmond</text>
    <rect x="278" y="12" width="90" height="20" rx="10" fill="#f3ddd5"/><text class="sm" x="323" y="26" text-anchor="middle" fill="#b4543a">needs capital</text>
    <g transform="translate(20,52)" font-size="12">
      <text class="sm" x="0" y="0">Members</text><text x="170" y="0" text-anchor="end">1</text>
      <text class="sm" x="190" y="0">Committed bonds</text><text x="350" y="0" text-anchor="end">$0</text>
      <text class="sm" x="0" y="20">Committed equity</text><text x="170" y="20" text-anchor="end">$50,000</text>
      <text class="sm" x="190" y="20">Mortgage</text><text x="350" y="20" text-anchor="end">$2.25M</text>
      <text class="sm" x="0" y="40">Node net</text><text class="neg" x="170" y="40" text-anchor="end">−$78,400</text>
      <text class="sm" x="190" y="40">Pool balance</text><text x="350" y="40" text-anchor="end">0 CC</text>
    </g>
    <line class="line" x1="20" y1="116" x2="364" y2="116"/>
    <text class="sm" x="20" y="138">Capital stack: <tspan font-weight="700" fill="#1c1a17">unclaimed</tspan></text>
    <rect class="ph" x="286" y="124" width="78" height="20" rx="6"/><text class="sm" x="325" y="138" text-anchor="middle">claim role</text>
    <g transform="translate(20,158)" opacity="0.45">
      <text class="sm" x="0" y="0">Internal rent / mo</text><text x="344" y="0" text-anchor="end" font-weight="600">$1,200</text>
      <rect class="ph" x="0" y="8" width="344" height="6" rx="3"/><circle cx="120" cy="11" r="7" fill="#9a948a"/>
      <text class="sm" x="0" y="36">Commercial rent / mo</text><text x="344" y="36" text-anchor="end" font-weight="600">$3,000</text>
      <rect class="ph" x="0" y="44" width="344" height="6" rx="3"/><circle cx="90" cy="47" r="7" fill="#9a948a"/>
      <text class="sm" x="0" y="72">Bond rate</text><text x="344" y="72" text-anchor="end" font-weight="600">5.00%</text>
      <rect class="ph" x="0" y="80" width="344" height="6" rx="3"/><circle cx="150" cy="83" r="7" fill="#9a948a"/>
      <text class="sm" x="0" y="100">(locked — claim the role to set dials)</text>
    </g>
  </g>
  <text class="ann" x="1204" y="584" text-anchor="end">↑ each card = one node; dials live only for the role-holder</text>

  <!-- FEDERATION DIALS PANEL -->
  <g transform="translate(416,588)">
    <rect class="card" x="0" y="0" width="788" height="120" rx="10"/>
    <text class="h3" x="20" y="28">Federation dials <tspan class="sm">(you hold this role — apply across every node)</tspan></text>
    <g transform="translate(20,52)">
      <text class="sm" x="0" y="0">Compression floor (CC/hr) — the commune↔market labor dial</text><text x="360" y="0" text-anchor="end" font-weight="600">25</text>
      <rect class="ph" x="0" y="8" width="360" height="6" rx="3"/><circle cx="80" cy="11" r="7" fill="#2f5d7d"/>
      <text class="sm" x="410" y="0">Demurrage rate (%/yr)</text><text x="768" y="0" text-anchor="end" font-weight="600">5</text>
      <rect class="ph" x="410" y="8" width="358" height="6" rx="3"/><circle cx="450" cy="11" r="7" fill="#2f5d7d"/>
    </g>
  </g>

  <!-- LEDGER / ECONOMY FEED (the next build) -->
  <g transform="translate(416,732)">
    <rect class="card" x="0" y="0" width="788" height="220" rx="10" stroke-dasharray="6 4"/>
    <text class="h3" x="20" y="28">Economy feed <tspan class="ann">— NEXT: rent + clearing posting to the ledger each period</tspan></text>
    <g transform="translate(20,52)" font-size="12">
      <text class="sm" x="0" y="0">month 3 · rent</text><text x="120" y="0">Ann → Node #1</text><text class="neg" x="300" y="0" text-anchor="end">−1,200 CC</text>
      <text class="sm" x="0" y="22">month 3 · labor</text><text x="120" y="22">Node #1 → Ann</text><text class="pos" x="300" y="22" text-anchor="end">+500 CC</text>
      <text class="sm" x="0" y="44">month 3 · clearing</text><text x="120" y="44">Node #1 → reserve</text><text class="neg" x="300" y="44" text-anchor="end">−40 CC</text>
      <text class="sm" x="0" y="66">month 3 · demurrage</text><text x="120" y="66">idle credit melts</text><text class="muted" x="300" y="66" text-anchor="end">continuous</text>
      <text class="sm" x="420" y="0">transfer</text><text x="540" y="0">Bob → Ann</text><text class="pos" x="740" y="0" text-anchor="end">+250 CC</text>
      <text class="sm" x="420" y="22">join</text><text x="540" y="22">Cara joins Node #2</text>
    </g>
    <text class="sm" x="20" y="190">An append-only, scrolling ledger of every transaction — the audit trail "those ratios get logged."</text>
  </g>

</svg>
